<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>spamguard.js</title>
        <style>
            body {
                max-width: 720px;
                margin: 40px auto;
                padding: 0 20px;
                font-family: system-ui, sans-serif;
                line-height: 1.5;
            }

            h2 {
                margin-top: 6rem;
            }

            h2:first-of-type {
                margin-top: 3rem;
            }

            .code,
            .result {
                position: relative;
                padding: 40px 15px 20px;
                border: 1px solid #ddd;
            }

            .code {
                margin-top: 30px;
                border-bottom: 0;
                border-radius: 4px 4px 0 0;
                font: 13px/1.6 ui-monospace, monospace;
                white-space: pre-wrap;
                word-break: break-all;
            }

            .result {
                background: #f7f7f9;
                border-radius: 0 0 4px 4px;
            }

            .code::before,
            .result::before {
                position: absolute;
                top: 12px;
                left: 15px;
                font: 700 12px system-ui, sans-serif;
                color: #959595;
                text-transform: uppercase;
                letter-spacing: 1px;
                content: 'Code';
            }

            .result::before {
                content: 'Result';
            }

            [hidden] {
                display: none !important;
            }

            form {
                display: grid;
                gap: 12px;
            }

            label {
                display: grid;
                gap: 4px;
                font-weight: 600;
            }

            label.inline {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 400;
            }

            input,
            select,
            button {
                font: inherit;
                padding: 8px 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            button {
                justify-self: start;
                background: #222;
                color: #fff;
                border-color: #222;
                cursor: pointer;
            }

            #copy {
                position: absolute;
                top: 6px;
                right: 6px;
                padding: 4px 10px;
                font: 12px system-ui, sans-serif;
            }
        </style>
    </head>
    <body>
        <h1>spamguard.js</h1>

        <h2>Generator</h2>

        <p>Runs entirely in your browser, nothing is sent anywhere.</p>

        <form id="generator">
            <label>
                Email address, phone number or text
                <input name="contact" required autocomplete="off" placeholder="name@example.com or +1 555 0100" />
            </label>
            <label>
                Link
                <select name="link">
                    <option value="mailto">Email</option>
                    <option value="tel">Phone call</option>
                    <option value="sms">SMS</option>
                    <option value="whatsapp">WhatsApp</option>
                    <option value="">No link</option>
                </select>
            </label>
            <label data-for="mailto">
                Subject
                <input name="subject" autocomplete="off" />
            </label>
            <label data-for="mailto whatsapp">
                Message
                <input name="message" autocomplete="off" />
            </label>
            <label class="inline"><input type="checkbox" name="reveal" /> Show only after a click (no pixels for screenshot bots)</label>
            <button>Generate code</button>
        </form>

        <div id="output" hidden>
            <div class="code"><button type="button" id="copy">Copy</button><code></code></div>
            <div class="result"></div>
        </div>

        <h2>Examples</h2>

        <div class="example">
            <a href="#" data-spamguard="zN4CvIgLQ+6HZgRhe8DYO52YT9HdA/BsdyyNnwiGUexv3ItrDJiYGj4=" aria-label="Send email">Please enable JavaScript to see the email address.</a>
        </div>

        <div class="example">
            <a href="#" data-spamguard="pYPkerVgpIQipB7ybmmF2WIERzQ9TQIE9I7qcWxJw5NRhzvZg7u9HfSMN/QFliQGrBwILVYZS9Kj7hKHNz4Qql53fjSK2qXvfg3xvlzKXx61938=" data-content>✉️ Write me</a>
        </div>

        <div class="example">
            <a href="#" data-spamguard="21B8aV9xM7p/2/romDVPEywFeSgH30KNnJ+sy1XQPMWNq3Z3Sw==" aria-label="Call"></a>
        </div>

        <div class="example">
            <a href="#" data-spamguard="oUb/w4N2y/1QtRFAQS8D5xoYSXFSdZhqKlcOVd5pf929UuLgc+xqun7xMsYk2NAgsvdzdfTx1EYQWHIJJ+vs" aria-label="Open WhatsApp"></a>
        </div>

        <div class="example">
            <a href="#" data-spamguard="lAwJh6KCEy/Q2sWofA+QCmVpkfyRGER/jwcbK3z72WxoivzvNw==" data-reveal>Show phone number</a>
        </div>

        <div class="example">
            <span data-spamguard="hZ55bxygX26eUrAEemkH4z7W"></span>
        </div>

</script>
        <script>
            document.querySelectorAll('.example').forEach((example) => {
                const code = document.createElement('div')
                const result = document.createElement('div')

                code.className = 'code'
                code.textContent = example.innerHTML.trim().replace(/\s{2,}/g, ' ')
                result.className = 'result'
                result.append(...example.childNodes)
                example.append(code, result)
            })

            spamguard()

            // Generator
            const form = document.getElementById('generator')
            const output = document.getElementById('output')
            const PHONE = ['tel', 'sms', 'whatsapp']
            const LABELS = { mailto: 'Send email', tel: 'Call', sms: 'Send SMS', whatsapp: 'Open WhatsApp' }
            const query = (params) => {
                const text = Object.entries(params)
                    .filter(([, value]) => value)
                    .map(([key, value]) => `${key}=${encodeURIComponent(value)}`)
                    .join('&')

                return text && `?${text}`
            }

            // Shows only the fields that apply to the selected link
            const update = () => form.querySelectorAll('[data-for]').forEach((label) => (label.hidden = !label.dataset.for.split(' ').includes(form.elements.link.value)))

            form.elements.contact.addEventListener('input', (event) => {
                const value = event.target.value
                const kind = value.includes('@') ? 'mailto' : /^[\d\s()+\-./]+$/.test(value) ? 'tel' : ''
                const link = form.elements.link

                event.target.setCustomValidity('')
                // Guess the link type only until the user picks one
                if (!link.dataset.picked && (kind === 'tel' ? !PHONE.includes(link.value) : link.value !== kind)) link.value = kind
                update()
            })
            form.elements.link.addEventListener('change', (event) => {
                event.target.dataset.picked = 'true'
                update()
            })
            update()

            form.addEventListener('submit', (event) => {
                event.preventDefault()

                const input = form.elements.contact
                const value = input.value.trim()
                const link = form.elements.link.value
                const reveal = form.elements.reveal.checked
                const number = value.replace(/[^\d+]/g, '')
                const { subject, message } = form.elements

                if (link === 'mailto' && !/^[^@\s]+@[^@\s]+\.[^@\s.]+$/.test(value)) {
                    input.setCustomValidity('Please enter a valid email address.')
                    return input.reportValidity()
                }

                if (PHONE.includes(link) && !/\d/.test(number)) {
                    input.setCustomValidity('Please enter a valid phone number.')
                    return input.reportValidity()
                }

                const href = {
                    mailto: `mailto:${value}${query({ subject: subject.value, body: message.value })}`,
                    tel: `tel:${number}`,
                    sms: `sms:${number}`,
                    whatsapp: `https://wa.me/${number.replace('+', '')}${query({ text: message.value })}`,
                }[link]
                const tag = link ? 'a' : reveal ? 'button' : 'span'
                const attrs = [
                    tag === 'a' && 'href="#"',
                    tag === 'button' && 'type="button"',
                    `data-spamguard="${spamguard.encode(value, href)}"`,
                    reveal ? 'data-reveal' : link && `aria-label="${LABELS[link]}"`,
                ].filter(Boolean)
                const placeholder = reveal ? `Show ${link === 'mailto' ? 'email address' : link ? 'phone number' : 'text'}` : ''
                const html = `<${tag} ${attrs.join(' ')}>${placeholder}</${tag}>`

                output.querySelector('code').textContent = [
                    html,
                    '',
                    '<script src="https://cdn.jsdelivr.net/npm/spamguard.js@27/dist/spamguard.js"><\/script>',
                    '<script>spamguard()<\/script>',
                ].join('\n')

                const result = output.querySelector('.result')
                result.innerHTML = html
                spamguard(result.firstElementChild)
                output.hidden = false
            })

            document.getElementById('copy').addEventListener('click', async (event) => {
                await navigator.clipboard.writeText(output.querySelector('code').textContent)
                event.target.textContent = 'Copied!'
                setTimeout(() => (event.target.textContent = 'Copy'), 1500)
            })
        </script>
    </body>
</html>
